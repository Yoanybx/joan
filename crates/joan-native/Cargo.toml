[package]
name = "joan-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "joan-native-bench"
path = "src/bin/bench.rs"
required-features = ["benchmark-tools"]

[features]
benchmark-tools = ["dep:joan-compiler", "dep:serde_json"]

[dependencies]
cranelift-codegen.workspace = true
cranelift-frontend.workspace = true
cranelift-jit.workspace = true
cranelift-module.workspace = true
cranelift-native.workspace = true
joan-ast = { path = "../joan-ast" }
joan-bytecode = { path = "../joan-bytecode" }
joan-canonical = { path = "../joan-canonical" }
joan-host = { path = "../joan-host" }
joan-compiler = { path = "../joan-compiler", optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
joan-compiler = { path = "../joan-compiler" }
serde_json.workspace = true

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
