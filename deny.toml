[advisories]
yanked = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
  { crate = "bitflags@1.3.2", reason = "region 3.0.2 in pinned cranelift-jit 0.134.3 requires the legacy bitflags branch while rustix uses v2" },
  { crate = "hashbrown@0.16.1", reason = "gimli 0.33.0 in pinned Cranelift 0.134.3 requires this older branch" },
  { crate = "windows-sys@0.52.0", reason = "region 3.0.2 in pinned cranelift-jit 0.134.3 requires this older branch" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
