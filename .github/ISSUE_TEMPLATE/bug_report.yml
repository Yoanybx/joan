name: Bug report
description: Report a reproducible JOAN defect without secrets or exploit details.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not submit credentials, private source, personal data, or unpatched vulnerability details here. Follow SECURITY.md for security reports.
  - type: input
    id: version
    attributes:
      label: JOAN version or commit
      placeholder: 0.1.0-alpha.1 or full commit SHA
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15 arm64, Ubuntu 24.04 x86_64
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command or API surface
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest non-sensitive input and deterministic steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets, private source and personal data.
          required: true
        - label: This is not an undisclosed security vulnerability.
          required: true
