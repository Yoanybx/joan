name: guardian

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  local-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Show pinned Rust toolchain
        run: rustc --version --verbose && cargo --version --verbose
      - name: Install pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install pinned Julia runtime
        uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9
        with:
          version: "1.12.7"
      - name: Verify pinned Julia runtime
        run: test "$(julia --startup-file=no -e 'print(VERSION)')" = '1.12.7'
      - name: Install pinned supply-chain gates
        run: |
          cargo install --locked cargo-audit@0.22.2 cargo-deny@0.20.2
          cargo install --locked cargo-cyclonedx@0.5.9
          cargo install --locked ripgrep@15.1.0
          test "$(rg --version | sed -n '1p')" = 'ripgrep 15.1.0'
      - name: Require complete local verification gate
        env:
          JOAN_NATIVE_ABI_REPORT: ${{ runner.temp }}/joan-native-abi-v1.json
          JOAN_NATIVE_BENCHMARK_REQUIRE_JULIA: "1"
        run: ./scripts/verify-all.sh --portable-evidence

  macos-contracts:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Show pinned Rust toolchain
        run: rustc --version --verbose && cargo --version --verbose
      - name: Install pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install pinned Julia runtime
        uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9
        with:
          version: "1.12.7"
      - name: Verify pinned Julia runtime
        run: test "$(julia --startup-file=no -e 'print(VERSION)')" = '1.12.7'
      - name: Install pinned supply-chain gates
        run: |
          cargo install --locked cargo-audit@0.22.2 cargo-deny@0.20.2
          cargo install --locked cargo-cyclonedx@0.5.9
          cargo install --locked ripgrep@15.1.0
          test "$(rg --version | sed -n '1p')" = 'ripgrep 15.1.0'
      - name: Require complete local verification gate
        env:
          JOAN_NATIVE_ABI_REPORT: ${{ runner.temp }}/joan-native-abi-v1.json
          JOAN_NATIVE_BENCHMARK_REQUIRE_JULIA: "1"
        run: ./scripts/verify-all.sh --portable-evidence
