name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout exact tagged source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Require protected corporate release authorization
        env:
          JOAN_RELEASE_APPROVAL_ID: ${{ vars.JOAN_RELEASE_APPROVAL_ID }}
          JOAN_RELEASE_APPROVED_COMMIT: ${{ vars.JOAN_RELEASE_APPROVED_COMMIT }}
          JOAN_RELEASE_APPROVED_TAG: ${{ vars.JOAN_RELEASE_APPROVED_TAG }}
        run: ./scripts/verify-publication-readiness.sh release

  build:
    needs: authorize
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install pinned supply-chain gates
        run: |
          cargo install --locked cargo-audit@0.22.2 cargo-deny@0.20.2
          cargo install --locked cargo-cyclonedx@0.5.9
      - name: Require Cargo version to match tag
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=JSON.parse(s);const p=m.packages.find(x=>x.name==="joan-node");process.stdout.write(p.version)})')"
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Verify source contracts
        env:
          JOAN_NATIVE_ABI_REPORT: ${{ runner.temp }}/joan-native-abi-v1.json
        run: ./scripts/verify-all.sh
      - name: Build target binary
        run: |
          rustup target add "${{ matrix.target }}"
          cargo build --locked --release --target "${{ matrix.target }}" -p joan-node
      - name: Package release
        run: ./scripts/package-release.sh "$GITHUB_REF_NAME" "${{ matrix.target }}" dist
      - name: Attest package provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763
        with:
          subject-path: dist/*.tar.gz
      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: joan-release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: joan-release-*
          path: dist
          merge-multiple: true
      - name: Verify package checksums again
        run: cd dist && shasum -a 256 -c *.sha256
      - name: Publish immutable-tag release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          arguments=("$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            arguments+=(--prerelease)
          fi
          gh release create "${arguments[@]}" dist/*
